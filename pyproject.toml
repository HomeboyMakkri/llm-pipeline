[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-text-pipeline"
version = "0.1.0"
description = "Учебный многошаговый пайплайн для обработки пользовательского текста с LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0,<3.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.scripts]
llm-pipeline = "llm_pipeline.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
