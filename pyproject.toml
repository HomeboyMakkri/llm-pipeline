[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-text-pipeline"
version = "0.1.0"
description = "Учебный многошаговый пайплайн для обработки пользовательского текста с LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pyright[nodejs]==1.1.414", "pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
